server:
  port: 8080

spring:
  application:
    name: campus-market
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: campus-market-jwt-secret-key-change-me-in-production-2026
    expire-hours: 72
  upload-dir: ./uploads
